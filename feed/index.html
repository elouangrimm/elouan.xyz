<body>
  <link rel="alternate" type="application/rss+xml" title="elouan.xyz" href="https://elouan.xyz/feed.xml" />

  <h1><a href="/">elouan.xyz</a> // Feed</h1>

  <h4 style="margin-bottom: 0.3em">
    my feed ^^ (wont post often)
  </h4>
  <a id="rss_global" href="https://elouan.xyz/feed.xml">https://elouan.xyz/feed.xml</a><button
    style="margin: 0 0.5em 0.7em" onclick="copyLink('a#rss_global')">
    Copy Feed Link
  </button>

  <hr>

  <noscript>I uses jumpyscript to load the feed, so youre gonna need to enable javascript!</noscript>

  <header style="margin-top: 19px">
    <input type="search" id="search" class="search" placeholder="Search..." />
  </header>

  <main id="items"></main>

  <template id="item-template">
    <section class="item-container">
      <h2 class="title">Title</h2>
      <p class="pub-date">Date</p>
      <p class="description">Description</p>
      <a class="link" href="#">Link</a>
    </section>
    <br>
  </template>

  <script>
    const copyLink = (selector) => {
      const element = document.querySelector(selector);
      const text = element.href;
      if (!text) {
        console.warn(`${selector} didn't contain any text`);
      }
      const style = element.style;
      element.style =
        "background-color: var(--green); color: var(--stone-050);outline: 2px solid var(--green);";
      setTimeout(() => {
        element.style = style;
      }, 500);

      navigator.clipboard.writeText(text);
    };
  </script>

  <script src="../scripts/feed.js"></script>
</body>

</html>
