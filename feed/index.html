<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />

  <title>Feed // elouan.xyz</title>

  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180x180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png">

  <link rel="stylesheet" href="/styles/style.css" />
  <link rel="stylesheet" href="feed.css" />
  <link rel="alternate" type="application/rss+xml" title="elouan.xyz" href="https://elouan.xyz/feed.xml" />

  <script src="/scripts/analytics.js" defer></script>
</head>

<body>
  <h1 class="heading"><a href="/">elouan.xyz</a> // Feed</h1>

  <h4 style="margin-bottom: 0.3em">
    my feed ^^ (wont post often)
  </h4>
  <a id="rss_global" href="https://elouan.xyz/feed.xml">https://elouan.xyz/feed.xml</a><button
    style="margin: 0 0.5em 0.7em" onclick="copyLink('a#rss_global')">
    Copy Feed Link
  </button>

  <hr>

  <noscript>I use jumpyscript to load the feed, so youre gonna need to enable javascript!</noscript>

  <header style="margin-top: 19px">
    <input type="search" id="search" class="search" placeholder="Search..." />
  </header>

  <main id="items"></main>

  <template id="item-template">
    <section class="item-container">
      <h2 class="title">Title</h2>
      <p class="pub-date">Date</p>
      <p class="description">Description</p>
      <a class="link" href="#">Link</a>
    </section>
    <br>
  </template>

  <script>
    const copyLink = (selector) => {
      const element = document.querySelector(selector);
      const text = element.href;
      if (!text) {
        console.warn(`${selector} didn't contain any text`);
      }
      const style = element.style;
      element.style =
        "background-color: var(--green); color: var(--c050);outline: 2px solid var(--green);";
      setTimeout(() => {
        element.style = style;
      }, 500);

      navigator.clipboard.writeText(text);
    };
  </script>

  <script src="../scripts/feed.js" defer></script>
</body>

</html>
