<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Photos // elouan.xyz</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/styles/style.css" />
    <link rel="stylesheet" href="/photos/photos.css" />

    <script src="https://cdn.jsdelivr.net/npm/exif-js" defer></script>
    <script src="/scripts/tooltip.js" defer></script>
    <script src="/scripts/analytics.js" defer></script>
</head>

<body>
    <h1 class="heading"><a href="/">elouan.xyz</a> // Photos</h1>

    <h3>All taken by Me!</h3>
    <h4>
        ...using either a <span class="has-tooltip" data-tooltip="Canon EOS 80D">Canon DSLR camera</span> borrowed from
        the
        Oregon Museum of
        Science and Industry, my cheap $100
        <a href="https://nuumobile.com/product/a23-plus-android-smartphone/">Android phone</a>, or my 2015 Canon EOS
        1200D.
    </h4>

    <hr />

    <div class="gallery-container">
        <div class="gallery" id="gallery">
            <p>Loading my photos...</p>
        </div>
    </div>

    <div class="fullscreen-overlay" id="fullscreen-overlay" style="display: none;">
        <div class="fullscreen-content" id="fullscreen-content">
            <img class="fullscreen-image" id="fullscreen-image" src="" alt="Fullscreen Image" />
            <p class="image-description" id="image-description"></p>
        </div>
    </div>

    <div id="tooltip-display" class="tooltip" role="tooltip"></div>
    <script src="/scripts/gallery.js" defer></script>
    <script defer src="https://cdn.jsdelivr.net/npm/quicklink@3.0.1/dist/quicklink.umd.js"></script>
    <script>
        window.addEventListener('load', () => {
            quicklink.listen();
        });
    </script>
</body>

</html>
