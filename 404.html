<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>404 // elouan.xyz</title>
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180x180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png">

    <script src="/scripts/analytics.js" defer></script>
</head>

<body>
    <h1 class="heading"><a href="/">elouan.xyz</a> // 404</h1>
    <p id="error-message">Whatever you were looking for, it's not here.</p>

    <script>
        // Check if the ?short parameter is present in the URL
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('short')) {
            document.getElementById('error-message').textContent = 'The short URL you visited is incorrect or does not exist anymore.';
        }
    </script>
</body>

</html>
