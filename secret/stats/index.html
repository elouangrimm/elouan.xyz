<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encrypted Page</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link rel="stylesheet" href="../styles/style.css" />
    <style>
        #password-container {
            text-align: center;
            margin-bottom: 2rem;
        }

        #password-container h2 {
            margin-bottom: 1.5rem;
            color: var(--stone-300);
        }

        #password-input {
            width: 100%;
            padding: 0.75em;
            margin-bottom: 1rem;
            font-size: 1em;
            box-sizing: border-box;

            font-family: var(--font-mono);
            background-color: var(--stone-800);
            color: var(--stone-050);
            border: 2px solid var(--stone-700);
            border-radius: 4px;
        }

        #password-input:focus {
            border-color: var(--blue);
            outline: none;
        }

        #go-button {
            width: 100%;
            padding: 0.75em 1em;
            font-size: 1.1em;
            font-family: var(--font-mono);
            font-weight: bold;
            border-radius: 4px;
        }

        #decrypted-content {
            margin-top: 2rem;
        }

        #decrypted-content h1,
        #decrypted-content h2,
        #decrypted-content p {
            color: var(--stone-200);
        }
    </style>
</head>

<body>

    <div class="container">
        <div id="password-container">
            <h2>Enter your Secret Password to view the private content...</h2>
            <input type="password" id="password-input" placeholder="Password">
            <button id="go-button">DISCOVER</button>
        </div>

        <div id="encrypted-content" style="display: none;">U2FsdGVkX1/x8p3ahBZCbh11tueDMvHshZgL8QANlOM=</div>

        <div id="decrypted-content"></div>
    </div>

    <script>
        document.getElementById('go-button').addEventListener('click', function () {
            var password = document.getElementById('password-input').value;
            var encryptedContent = document.getElementById('encrypted-content').innerText;

            try {
                var decrypted = CryptoJS.AES.decrypt(encryptedContent, password);
                var decryptedText = decrypted.toString(CryptoJS.enc.Utf8);

                if (decryptedText) {
                    document.getElementById('decrypted-content').innerHTML = decryptedText;
                    document.getElementById('password-container').style.display = 'none';
                } else {
                    alert('Wrong Password!');
                }
            } catch (e) {
                alert('Wrong Password!');
                console.error(e);
            }
        });
    </script>

</body>

</html>
